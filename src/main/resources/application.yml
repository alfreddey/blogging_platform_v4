spring:
  profiles:
    active: dev
  application:
    name: demo
  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true
  mongodb:
    uri: ${MONGODB_URI}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: ${baseUrl}/login/oauth2/code/google  # default is fine
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub   # Google's unique user ID

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

api:
  base-url: api/v1

baseUrl: http://localhost:8081