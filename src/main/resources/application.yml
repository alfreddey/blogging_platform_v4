spring:
  profiles:
    active: dev
  application:
    name: demo
  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true
  mongodb:
    uri: ${MONGODB_URI}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${baseUrl}/login/oauth2/code/{registrationId}  # default is fine
        provider:
          google:
            user-name-attribute: sub   # Google's unique user ID

server:
  servlet:
    session:
      timeout: 10s
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

api:
  base-url: api/v1

baseUrl: http://localhost:8081